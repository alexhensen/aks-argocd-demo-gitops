## ClusterIssuers voor Let's Encrypt.
##
## Bewust twee: staging heeft geen rate limit maar geeft een certificaat dat
## geen enkele browser vertrouwt. Eerst hiermee valideren dat de HTTP-01
## challenge slaagt, pas daarna omzetten naar productie. Zo verbruik je nooit
## per ongeluk het echte quotum (50 certificaten per week per domein)
## tijdens het testen.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: a.hensen@me.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: a.hensen@me.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
