## Argo CD waarden voor de demo.
## Op het eigen domein: TLS via cert-manager + Let's Encrypt, en een extra
## basic-auth-laag vóór de inlogpagina zelf (defense in depth — de UI is
## publiek bereikbaar, de admin login mag niet de enige verdedigingslinie zijn).

global:
  domain: argocd.demo.alexhensen.com

configs:
  params:
    # nginx termineert TLS, dus Argo CD mag zelf in plain HTTP praten.
    server.insecure: true
  cm:
    # Zonder dit blijven PR omgevingen als "OutOfSync" staan omdat Argo CD
    # de namespace die hij zelf aanmaakt niet herkent.
    application.resourceTrackingMethod: annotation
    timeout.reconciliation: 30s

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.demo.alexhensen.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: argocd-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Argo CD demo - vraag toegang aan Alex"
    tls: true

applicationSet:
  enabled: true

dex:
  enabled: false

notifications:
  enabled: false
