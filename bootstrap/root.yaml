apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexhensen/aks-argocd-demo-gitops.git
    targetRevision: main
    path: bootstrap
    directory:
      recurse: false
      # De Helm values van Argo CD zelf zijn geen Kubernetes manifest.
      exclude: "argocd-values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
