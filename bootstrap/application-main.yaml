apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-main
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexhensen/aks-argocd-demo-gitops.git
    targetRevision: main
    path: charts/demo-app
    helm:
      valuesObject:
        environmentName: main
        commitSha: "2f9ad383e81d5da6cd2205ac9e4f6d2406746c69"
        image:
          repository: ghcr.io/alexhensen/aks-argocd-demo-app
          # Deze regel wordt door CI bijgewerkt na elke merge naar main.
          tag: sha-2f9ad383e81d5da6cd2205ac9e4f6d2406746c69
        ingress:
          host: app.demo.alexhensen.com
          clusterIssuer: letsencrypt-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
