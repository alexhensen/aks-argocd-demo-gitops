apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-main
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexhensen/aks-argocd-demo-gitops.git
    targetRevision: main
    path: charts/demo-app
    helm:
      valuesObject:
        environmentName: main
        commitSha: "829fd7171c4e638a94843cbc4bb2040c5f21cffc"
        image:
          repository: ghcr.io/alexhensen/aks-argocd-demo-app
          # Deze regel wordt door CI bijgewerkt na elke merge naar main.
          tag: sha-829fd7171c4e638a94843cbc4bb2040c5f21cffc
        ingress:
          host: app.demo.alexhensen.com
          clusterIssuer: letsencrypt-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
