apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-main
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexhensen/aks-argocd-demo-gitops.git
    targetRevision: main
    path: charts/demo-app
    helm:
      valuesObject:
        environmentName: main
        commitSha: "22207279ebc33edd2c4abe24036ea77e51be1d47"
        image:
          repository: ghcr.io/alexhensen/aks-argocd-demo-app
          # Deze regel wordt door CI bijgewerkt na elke merge naar main.
          tag: sha-22207279ebc33edd2c4abe24036ea77e51be1d47
        ingress:
          host: app.demo.alexhensen.com
          clusterIssuer: letsencrypt-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
