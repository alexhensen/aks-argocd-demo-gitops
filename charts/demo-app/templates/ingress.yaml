{{- if and .Values.ingress.enabled .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demo-app.name" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    {{- /*
      Noindex-header komt uit de app zelf (Program.cs), niet uit een nginx
      configuration-snippet: die zijn hier uitgeschakeld door de
      ingress-nginx installatie (CVE-2021-25742/25743).
    */}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.clusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      # Eén secret per host: elke preview heeft zijn eigen certificaat en
      # niets om op te ruimen buiten de namespace die toch al verdwijnt.
      secretName: {{ include "demo-app.name" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "demo-app.name" . }}
                port:
                  number: 80
{{- end }}
